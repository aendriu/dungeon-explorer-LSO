#   docker compose up              -> avvia il server
#   docker compose run client      -> avvia un client interattivo (scrivere "server" come IP)

services:
  server:
    build: .
    command: ./server.out
    ports:
      - "9090:9090"
    restart: unless-stopped

  client:
    build: .
    command: ./client.out
    depends_on:
      - server
    stdin_open: true       # == -i 
    tty: true              # == -t (terminale per ncurses)
    environment:
      - TERM=xterm-256color
